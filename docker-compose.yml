services:
  db:
    image: postgres:16
    container_name: orders_postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: orders_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    image: node:20
    container_name: orders_app
    working_dir: /usr/src/app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # DATABASE_URL from .env decides which DB the app uses:
      #   - unset  → the local compose `db` service (postgres container below)
      #   - set    → whatever you point it at, e.g. prod via the tunnel:
      #       DATABASE_URL=postgresql://postgres:PASS@host.docker.internal:15432/postgres
      #       DB_SSL=true        (prod requires SSL; the local db does not)
      # host.docker.internal resolves to the host from inside the container (Docker Desktop).
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}}
      DB_SSL: ${DB_SSL:-}
      REDIS_URL: redis://redis:6379
      PM2_POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PM2_EXEC_MODE: fork
      PM2_INSTANCES: 1
    volumes:
      - ./:/usr/src/app
    command: sh -c "npm install && sh /usr/src/app/entrypoint.sh"
    ports:
      - "${PORT-3000}:3000"
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
